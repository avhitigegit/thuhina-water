# UAT (AWS test server, test data only). Only the setup data is loaded (db/setup: users, bottle types, prices,
# products, suppliers, factories, opening stock) – no demo customers or transactions, so the client can try the
# system from a clean start. Swagger UI is available for testing.

spring:
  flyway:
    locations: classpath:db/migration,classpath:db/setup

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  demo-data:
    # Demo-data generator (M12) off – the client enters their own test transactions.
    enabled: false
