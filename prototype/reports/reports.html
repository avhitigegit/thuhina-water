    document.title = REPORTS[key].name + ' report · Thuhina Water';
    UI.$('#kpis').innerHTML = (r.kpis || []).map(function (k) { return '<div class="kpi"><div class="label">' + k[0] + '</div><div class="value">' + k[1] + '</div></div>'; }).join('');
    var h = '<div class="print-only"><h2>' + REPORTS[key].name + ' report – ' + D.dmy(F) + ' to ' + D.dmy(T) + '</h2></div>';
    if (r.chart) h += '<div class="card"><h2>' + (r.chartTitle || 'By day') + '</h2><div id="chart"></div></div>';
    (r.tables || []).forEach(function (tb, i) { h += '<div class="card"><h2>' + UI.esc(tb.title) + '</h2><div class="report-table" id="t' + i + '"></div></div>'; });
    if (r.note) h += '<p class="small muted">' + UI.esc(r.note) + '</p>';
    UI.$('#out').innerHTML = h;
    if (r.chart) UI.bars(UI.$('#chart'), r.chart, UI.lkr);
    (r.tables || []).forEach(function (tb, i) { UI.table('#t' + i, { columns: tb.columns, rows: tb.rows, empty: 'Nothing in this period.' }); });
  }
  UI.rangeBar(UI.$('#bar'), D.monthStart(D.prevMonth(D.month(td))), td, function (f, t) { F = f; T = t; run(); }, sel);
  UI.$('#bar [name=rep]').addEventListener('change', run);
});
</script>
</body>
</html>
