<!doctype html>
<!-- BRD: FR-14 (suppliers of empty bottles and resale products – items chosen from the item list), FR-22 (filling factories with a fixed charge
     per bottle by bottle type – more than one factory allowed at the client's request), BR-11 (paid per bottle filled). Codes are generated by the system. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suppliers &amp; Factories · Thuhina Water</title>
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-page="master-data/suppliers">
<main id="app">
  <div id="tabs"></div>
  <div data-pane="suppliers" class="card">
    <div class="card-head"><h2>Suppliers</h2><button class="btn primary write-only" id="add-s">+ New supplier</button></div>
    <div id="sup"></div>
  </div>
  <div data-pane="factories" class="card">
    <div class="card-head"><h2>Filling factories</h2><button class="btn primary write-only" id="add-f">+ New factory</button></div>
    <p class="small muted">Each factory charges a fixed price per bottle filled (not per litre). Rejected bottles are not charged.</p>
    <div id="fac"></div>
  </div>
</main>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/layout.js"></script>
<script>
App.page(function () {
  var db = TW.db, Q = TW.Q;
  function itemList() { return Q.activeBottles().map(function (b) { return { v: b.id, l: 'Empty ' + b.name }; }).concat(db.products.filter(function (p) { return p.active; }).map(function (p) { return { v: p.id, l: p.name }; })); }
  function itemNames(ids) { return (ids || []).map(function (i) { return UI.esc(Q.itemName(i)); }).join(', '); }
  function termsSel(val) { return '<select name="terms">' + UI.options(TW.TERMS, val == null ? 30 : val) + '</select>'; }

  /* ---------- Suppliers (FR-14) ---------- */
  function suppliers() {
    UI.table('#sup', {
      columns: [
        { h: 'Supplier', f: function (s) { return '<b>' + UI.esc(s.name) + '</b> <span class="small muted mono">' + s.id + '</span><div class="small muted">' + UI.esc(s.address) + '</div>'; } },
        { h: 'Contact', f: function (s) { return UI.esc(s.contact) + '<div class="small muted">' + UI.esc(s.phone) + ' · ' + UI.esc(s.email) + '</div>'; } },
        { h: 'Supplies', f: function (s) { return '<span class="small">' + itemNames(s.items) + '</span>'; } },
        { h: 'Payment terms', f: function (s) { return Q.termsLabel(s.terms); } },
        { h: 'Owed', cls: 'num', f: function (s) { var o = Q.supplierOwed(s.id); return o ? '<b>' + UI.lkr(o) + '</b>' : '–'; } },
        { h: 'Status', f: function (s) { return UI.statusBadge(s.active ? 'Active' : 'Inactive'); } },
        { h: '', cls: 'actions', f: function (s) { return '<button class="btn sm write-only" data-s="' + s.id + '">Edit</button>'; } }
      ], rows: db.suppliers
    });
  }
  function editSupplier(s) {
    var v = function (k) { return UI.esc(s ? s[k] : ''); };
    var have = s ? s.items || [] : [];
    UI.modal({
      title: s ? 'Edit ' + s.name : 'New supplier', wide: true,
      body: '<div class="form-grid"><div class="field"><label>Supplier code</label><input value="' + (s ? s.id : 'Generated on save') + '" readonly></div><div class="field req span2"><label>Name</label><input name="sname" value="' + v('name') + '"></div>' +
        '<div class="field"><label>Contact person</label><input name="contact" value="' + v('contact') + '"></div><div class="field req"><label>Phone</label><input name="phone" value="' + v('phone') + '"></div><div class="field"><label>Email</label><input name="email" value="' + v('email') + '"></div>' +
        '<div class="field span2"><label>Address</label><input name="address" value="' + v('address') + '"></div><div class="field req"><label>Payment terms</label>' + termsSel(s ? s.terms : 30) + '</div>' +
        '<div class="field req full"><label>Supplies (tick all that apply)</label><div class="chips">' + itemList().map(function (i) { return '<label><input type="checkbox" class="it" value="' + i.v + '"' + (have.indexOf(i.v) >= 0 ? ' checked' : '') + '> ' + UI.esc(i.l) + '</label>'; }).join('') + '</div></div>' +
        (s ? '<label class="check"><input type="checkbox" name="active"' + (s.active ? ' checked' : '') + '> Active</label>' : '') + '</div>',
      buttons: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', onClick: function (close, el) {
        var d = { name: UI.mval(el, 'sname').trim(), contact: UI.mval(el, 'contact'), phone: UI.mval(el, 'phone'), email: UI.mval(el, 'email'), terms: UI.mval(el, 'terms'), address: UI.mval(el, 'address'), items: UI.$$('.it:checked', el).map(function (x) { return x.value; }) };
        if (s) { d.id = s.id; d.active = UI.mval(el, 'active'); }
        if (UI.result(TW.Ops.saveSupplier(d, !s), 'Supplier saved')) { close(); suppliers(); }
        return false;
      } }]
    });
  }
  UI.$('#sup').addEventListener('click', function (e) { var id = e.target.getAttribute('data-s'); if (id) editSupplier(Q.supplier(id)); });
  var as = UI.$('#add-s'); if (as) as.addEventListener('click', function () { editSupplier(null); });

  /* ---------- Filling factories (FR-22, BR-11) ---------- */
  function factories() {
    UI.table('#fac', {
      columns: [
        { h: 'Factory', f: function (f) { return '<b>' + UI.esc(f.name) + '</b> <span class="small muted mono">' + f.id + '</span><div class="small muted">' + UI.esc(f.address) + '</div>'; } },
        { h: 'Contact', f: function (f) { return UI.esc(f.contact) + '<div class="small muted">' + UI.esc(f.phone) + '</div>'; } },
        { h: 'Charge per bottle', f: function (f) { return Q.activeBottles().map(function (b) { return b.litres + 'L ' + (f.charges[b.id] ? UI.lkr(f.charges[b.id]) : '–'); }).join(' · '); } },
        { h: 'Payment terms', f: function (f) { return Q.termsLabel(f.terms); } },
        { h: 'At factory now', cls: 'num', f: function (f) { return UI.sum(db.batches.filter(function (b) { return b.factoryId === f.id; }), function (b) { return Q.batchReturned(b).outstanding; }); } },
        { h: 'Owed', cls: 'num', f: function (f) { var o = Q.factoryOwed(f.id); return o ? '<b>' + UI.lkr(o) + '</b>' : '–'; } },
        { h: 'Status', f: function (f) { return UI.statusBadge(f.active ? 'Active' : 'Inactive'); } },
        { h: '', cls: 'actions', f: function (f) { return '<button class="btn sm write-only" data-f="' + f.id + '">Edit</button>'; } }
      ], rows: db.factories
    });
  }
  function editFactory(f) {
    var v = function (k) { return UI.esc(f ? f[k] : ''); };
    UI.modal({
      title: f ? 'Edit ' + f.name : 'New filling factory', wide: true,
      body: '<div class="form-grid"><div class="field"><label>Factory code</label><input value="' + (f ? f.id : 'Generated on save') + '" readonly></div><div class="field req span2"><label>Name</label><input name="fname" value="' + v('name') + '"></div>' +
        '<div class="field span2"><label>Address</label><input name="address" value="' + v('address') + '"></div><div class="field"><label>Licence</label><input name="licence" value="' + v('licence') + '"></div>' +
        '<div class="field"><label>Contact person</label><input name="contact" value="' + v('contact') + '"></div><div class="field"><label>Phone</label><input name="phone" value="' + v('phone') + '"></div><div class="field"><label>Email</label><input name="email" value="' + v('email') + '"></div>' +
        '<div class="field req"><label>Payment terms</label>' + termsSel(f ? f.terms : 30) + '</div>' +
        Q.activeBottles().map(function (b) { return '<div class="field req"><label>Charge per ' + b.litres + 'L bottle (Rs.)</label><input type="number" min="0" name="ch_' + b.id + '" value="' + (f && f.charges[b.id] ? f.charges[b.id] : '') + '"></div>'; }).join('') +
        (f ? '<label class="check"><input type="checkbox" name="active"' + (f.active ? ' checked' : '') + '> Active</label>' : '') + '</div><p class="small muted">A new charge applies to batches sent after saving.</p>',
      buttons: [{ label: 'Cancel' }, { label: 'Save', cls: 'primary', onClick: function (close, el) {
        var ch = {}; Q.activeBottles().forEach(function (b) { ch[b.id] = UI.mval(el, 'ch_' + b.id); });
        var d = { name: UI.mval(el, 'fname').trim(), terms: UI.mval(el, 'terms') };
        ['licence', 'address', 'contact', 'phone', 'email'].forEach(function (k) { d[k] = UI.mval(el, k); });
        if (f) { d.id = f.id; d.active = UI.mval(el, 'active'); }
        if (UI.result(TW.Ops.saveFactory(d, ch, !f), 'Factory saved')) { close(); factories(); }
        return false;
      } }]
    });
  }
  UI.$('#fac').addEventListener('click', function (e) { var id = e.target.getAttribute('data-f'); if (id) editFactory(Q.factory(id)); });
  var af = UI.$('#add-f'); if (af) af.addEventListener('click', function () { editFactory(null); });

  UI.tabs('#tabs', [{ id: 'suppliers', label: 'Suppliers' }, { id: 'factories', label: 'Filling factories' }]);
  suppliers(); factories();
});
</script>
</body>
</html>
