# Reverse proxy (design 1): "/" → Next.js (web), "/api" → Spring Boot (api).
# Production adds HTTPS (Let's Encrypt) and HSTS in front of this – set up at go-live (M14).

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;   # CSV imports and attachments

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health and other actuator endpoints stay internal (design 11).
    location /api/actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_read_timeout 120s;    # large report exports
    }

    location / {
        proxy_pass http://web:3000;
    }
}
