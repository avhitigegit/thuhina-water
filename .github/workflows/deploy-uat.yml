# Deploys UAT (plan section 9): a merge into the uat branch builds both images for the server's ARM CPU,
# pushes them to ECR, uploads the server files (deploy/server) and runs scripts/deploy.sh on the server through SSM.
# Run it by hand with an existing tag (for example uat-1a2b3c4d5e6f) to roll back without building.
#
# GitHub environment "uat": variable AWS_REGION; secrets AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (IAM user
# thuhina-uat-github-deploy), ECR_REGISTRY, RELEASES_BUCKET, UAT_INSTANCE_ID, UAT_URL. The repository is public,
# so everything that identifies the account or server is a secret (hidden in the logs).
name: deploy-uat

on:
  push:
    branches: [uat]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag to deploy again (empty = build the uat branch)"
        required: false
        default: ""

# One deployment at a time; a newer one waits instead of cancelling one that is half done.
concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    name: Image tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=uat-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: tag
    if: needs.tag.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm   # same CPU type as the server (Graviton), so no slow emulation
    environment: uat
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - image: api
            context: server
          - image: web
            context: client
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ secrets.ECR_REGISTRY }}/thuhina/${{ matrix.image }}:${{ needs.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to UAT
    needs: [tag, build]
    # Runs after a successful build, or straight away when re-deploying an existing tag.
    if: always() && needs.tag.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 25
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      INSTANCE_ID: ${{ secrets.UAT_INSTANCE_ID }}
      RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET }}
      UAT_URL: ${{ secrets.UAT_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Hide the server address in the logs
        run: |
          host="${UAT_URL#https://}"
          echo "::add-mask::$host"
          echo "::add-mask::$(echo "${host%.sslip.io}" | tr - .)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Check the images exist
        run: |
          for image in api web; do
            aws ecr describe-images --repository-name "thuhina/$image" --image-ids imageTag="$TAG" > /dev/null \
              || { echo "::error::thuhina/$image:$TAG not found in ECR"; exit 1; }
          done

      - name: Upload the server files
        run: |
          tar -czf release.tar.gz -C deploy/server .
          aws s3 cp release.tar.gz "s3://$RELEASES_BUCKET/releases/$TAG.tar.gz" --only-show-errors

      - name: Run deploy.sh on the server (SSM)
        run: |
          # SSM runs this with sh (dash), not bash – keep it POSIX; deploy.sh itself runs in bash.
          script=$(cat <<EOF
          set -eu
          . /etc/thuhina-deploy.env
          dir="\$APP_DIR/releases/$TAG"
          rm -rf "\$dir" && mkdir -p "\$dir"
          aws s3 cp "s3://\$RELEASES_BUCKET/releases/$TAG.tar.gz" - --region "\$AWS_REGION" | tar -xz -C "\$dir"
          bash "\$dir/scripts/deploy.sh" "$TAG"
          EOF
          )
          jq -n --arg s "$script" '{commands: [$s], executionTimeout: ["1200"]}' > params.json

          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "deploy $TAG" --parameters file://params.json --query Command.CommandId --output text)
          echo "SSM command $id"

          status=Pending
          for i in $(seq 1 130); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- server output -----"
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "-------------------------"
          [ "$status" = "Success" ] || { echo "::error::deploy finished with status $status"; exit 1; }

      # Port 443 only accepts allowed addresses, so the full check runs on the server (deploy.sh).
      # From here: the server answers and sends visitors to HTTPS.
      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "http://${UAT_URL#https://}/login")
          [ "$code" = "301" ] || { echo "::error::expected 301 from port 80, got $code"; exit 1; }
          echo "UAT is running $TAG"
